<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule a Visit — FINDORA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="explore">

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V19a1 1 0 0 0 1 1h4v-5.5h4V20h4a1 1 0 0 0 1-1V9.5"/></svg>
      FINDORA
    </a>
    <nav class="nav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="properties.html" data-nav="explore">Explore</a>
      <a href="saved.html" data-nav="saved">Saved</a>
      <a href="messages.html" data-nav="messages">Messages</a>
      <a href="profile.html" data-nav="profile">Profile</a>
    </nav>
    <div class="header-actions">
      <button class="location-pill" id="locationPill"></button>
      <button class="icon-btn" aria-label="Notifications" id="notifBtn"></button>
      <a href="profile.html" class="avatar-btn"><img src="https://i.pravatar.cc/160?img=68" alt="John Doe"></a>
    </div>
  </div>
</header>

<main class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="property.html" id="svBreadcrumbName">Property</a><span class="sep">/</span>
    <span class="current">Schedule Visit</span>
  </div>

  <div class="page-head">
    <h1 class="h1">Schedule a Visit</h1>
    <p class="lede mt-2">Pick a date and time that works for you — we'll confirm with the agent right away.</p>
  </div>

  <div class="pd-layout" style="margin-top:8px">
    <div>
      <div class="card-surface">
        <h3 class="h3 mb-4">Select Date</h3>
        <div class="date-row" id="dateRow"></div>

        <h3 class="h3 mt-6 mb-4">Select Time</h3>
        <div class="time-row" id="timeRow">
          <button type="button" class="time-chip">10:00 AM</button>
          <button type="button" class="time-chip">01:00 PM</button>
          <button type="button" class="time-chip">04:00 PM</button>
          <button type="button" class="time-chip">06:00 PM</button>
        </div>

        <h3 class="h3 mt-6 mb-4">Your Information</h3>
        <form id="scheduleForm">
          <div class="form-grid-2">
            <div class="field"><label>Full Name</label><input class="input" value="John Doe" required></div>
            <div class="field"><label>Email Address</label><input class="input" type="email" value="john.doe@email.com" required></div>
          </div>
          <div class="form-grid-2 mt-4">
            <div class="field"><label>Phone Number</label><input class="input" value="+91 98765 43210" required></div>
            <div class="field"><label>Additional Notes (Optional)</label><input class="input" placeholder="Any special requests or notes…"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-6" id="confirmVisitBtn">Confirm Visit</button>
        </form>
      </div>
    </div>

    <aside class="sticky-side">
      <div class="card-surface">
        <h4 class="eyebrow mb-3">Property</h4>
        <div class="summary-row">
          <img id="svPropImg" src="" alt="Property">
          <div>
            <div style="font-weight:700" id="svPropName"></div>
            <div class="text-sm text-muted mt-1" id="svPropMeta"></div>
          </div>
        </div>
      </div>
      <div class="agent-card">
        <h4 class="eyebrow mb-3">Agent Information</h4>
        <div class="agent-top">
          <img id="svAgentAvatar" src="" alt="Agent">
          <div>
            <div class="agent-name" id="svAgentName"></div>
            <div class="agent-role" id="svAgentRole"></div>
          </div>
        </div>
        <div class="mt-4 text-sm text-muted flex flex-col gap-2">
          <span class="flex items-center gap-2"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span id="svAgentPhone"></span></span>
          <span class="flex items-center gap-2"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span id="svAgentEmail"></span></span>
        </div>
      </div>
    </aside>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" data-nav="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="properties.html" data-nav="explore"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>Explore</a>
  <a href="saved.html" data-nav="saved"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
  <a href="messages.html" data-nav="messages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Messages</a>
  <a href="profile.html" data-nav="profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>

<script src="js/main.js"></script>
<script>
  document.getElementById('locationPill').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Kochi, Kerala';
  document.getElementById('notifBtn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span>';
</script>
</body>
</html>
