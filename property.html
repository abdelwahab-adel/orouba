<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details — FINDORA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="explore" id="propertyDetails">

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V19a1 1 0 0 0 1 1h4v-5.5h4V20h4a1 1 0 0 0 1-1V9.5"/></svg>
      FINDORA
    </a>
    <nav class="nav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="properties.html" data-nav="explore">Explore</a>
      <a href="saved.html" data-nav="saved">Saved</a>
      <a href="messages.html" data-nav="messages">Messages</a>
      <a href="profile.html" data-nav="profile">Profile</a>
    </nav>
    <div class="header-actions">
      <button class="location-pill" id="locationPill"></button>
      <button class="icon-btn" aria-label="Notifications" id="notifBtn"></button>
      <a href="profile.html" class="avatar-btn"><img src="https://i.pravatar.cc/160?img=68" alt="John Doe"></a>
    </div>
  </div>
</header>

<main class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="properties.html">Properties</a><span class="sep">/</span>
    <span class="current" id="pdBreadcrumbName">Property</span>
  </div>

  <div class="mt-4">
    <div class="gallery-hero" id="galleryHero"></div>
  </div>

  <div class="pd-layout">
    <div>
      <div class="pd-header">
        <div>
          <h1 class="h1" id="pdName">Property</h1>
          <div class="pd-loc" id="pdLocation"></div>
          <div class="rating mt-3" id="pdRating"></div>
        </div>
        <div class="flex gap-3 items-start">
          <div class="pd-price" id="pdPrice"></div>
          <button class="icon-btn" id="pdFavBtn" data-fav="" aria-label="Save property">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>
      </div>

      <div class="pd-stats">
        <div class="pd-stat">
          <span class="pd-stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 17V8a1 1 0 0 1 1-1h3a2 2 0 0 1 2 2v3"/><path d="M2 17h20"/><path d="M22 17v-4a2 2 0 0 0-2-2h-8"/><path d="M2 21v-4"/><path d="M22 21v-4"/></svg></span>
          <div><b id="pdBeds">3</b><span>Bedrooms</span></div>
        </div>
        <div class="pd-stat">
          <span class="pd-stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h16a1 1 0 0 1 1 1v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5v-2a1 1 0 0 1 1-1Z"/><path d="M7 12V6a2 2 0 0 1 3.5-1.3"/></svg></span>
          <div><b id="pdBaths">2</b><span>Bathrooms</span></div>
        </div>
        <div class="pd-stat">
          <span class="pd-stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span>
          <div><b id="pdArea">1200 sqft</b><span>Total Area</span></div>
        </div>
        <div class="pd-stat">
          <span class="pd-stat-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 11 6.5 6.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="2.5" y="11" width="19" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.7"/><circle cx="16.5" cy="17.5" r="1.7"/></svg></span>
          <div><b id="pdGarage">1</b><span>Garage</span></div>
        </div>
      </div>

      <div class="pd-block">
        <h3>About Property</h3>
        <div id="pdDescription"></div>
      </div>

      <div class="pd-block">
        <h3>Amenities</h3>
        <div class="amenities-grid" id="pdAmenities"></div>
      </div>

      <div class="pd-block">
        <h3>Property Details</h3>
        <table class="info-table"><tbody id="pdInfoTable"></tbody></table>
      </div>

      <div class="pd-block">
        <h3>Location</h3>
        <div class="map-embed">
          <iframe id="pdMapFrame" title="Property location map" style="width:100%;height:100%;border:0" loading="lazy"></iframe>
        </div>
      </div>

      <div class="pd-block" style="border-bottom:none">
        <div class="flex justify-between items-center mb-4">
          <h3 style="margin:0">Similar Properties</h3>
        </div>
        <div class="similar-scroller" id="similarProperties"></div>
      </div>
    </div>

    <aside class="sticky-side hide-mobile">
      <div class="agent-card" id="agent">
        <div class="agent-top">
          <img id="pdAgentAvatar" src="" alt="Agent">
          <div>
            <div class="agent-name" id="pdAgentName"></div>
            <div class="agent-role" id="pdAgentRole"></div>
          </div>
        </div>
        <div class="mt-4 text-sm text-muted flex flex-col gap-2">
          <span class="flex items-center gap-2"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span id="pdAgentPhone"></span></span>
          <span class="flex items-center gap-2"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span id="pdAgentEmail"></span></span>
        </div>
        <div class="agent-actions">
          <button class="btn btn-secondary btn-block" onclick="showToast('Message sent to agent')">Contact Agent</button>
          <a href="#" class="btn btn-primary btn-block" data-schedule-link>Schedule Visit</a>
        </div>
      </div>
    </aside>
  </div>
</main>

<div class="mobile-cta-bar">
  <button class="btn btn-secondary" onclick="showToast('Message sent to agent')">Contact Agent</button>
  <a href="#" class="btn btn-primary" data-schedule-link>Schedule Visit</a>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-top">
    <span class="lb-count"></span>
    <div class="lb-actions">
      <button class="icon-btn lb-close" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);color:#fff" aria-label="Close gallery">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="lightbox-stage">
    <button class="lightbox-nav prev" aria-label="Previous photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="Gallery photo">
    <button class="lightbox-nav next" aria-label="Next photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="lightbox-thumbs"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html" data-nav="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
  <a href="properties.html" data-nav="explore"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>Explore</a>
  <a href="saved.html" data-nav="saved"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
  <a href="messages.html" data-nav="messages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Messages</a>
  <a href="profile.html" data-nav="profile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</nav>

<script src="js/main.js"></script>
<script>
  document.getElementById('locationPill').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Kochi, Kerala';
  document.getElementById('notifBtn').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span>';
</script>
</body>
</html>
